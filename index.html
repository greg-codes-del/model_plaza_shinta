<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Massa Plaza Shinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: maket arsitek di atas meja gambar. Kanvas 3D memenuhi layar, panel kertas mengambang di kiri (skenario) dan kanan (angka). Satu tema terang, disengaja. */
:root{
  --paper:#e9edeb;      /* meja gambar */
  --card:#f8faf9;       /* kertas panel */
  --ink:#1b282d;        /* teks utama */
  --muted:#5d6b70;      /* teks sekunder */
  --line:#cbd3d1;       /* garis halus */
  --hub:#0e7c7b;        /* fungsi logistik (aksen) */
  --amber:#d99a1c;      /* bangunan baru / dok */
  --ruko:#c4463a;       /* bukan aset */
  --school:#46699c;     /* SMK */
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:300px;overflow:hidden;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:500 11px/1.2 var(--font-body);color:var(--ink);background:rgba(248,250,249,.92);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.lb::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:var(--ink);opacity:.45}
.lb.hub{background:var(--hub);color:#fff;border-color:var(--hub)}
.lb.new{background:var(--amber);color:#1b282d;border-color:var(--amber)}
.lb.ruko{color:var(--ruko);border-color:var(--ruko)}
.lb.green{background:#5f9450;color:#fff;border-color:#5f9450}
.lb.zone{background:transparent;border:0;font:600 10px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lb.zone::after{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 rgba(27,40,45,.04),0 8px 24px rgba(27,40,45,.08)}
#left{position:absolute;left:16px;top:16px;width:300px;max-width:calc(100% - 32px);padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px}
#right{position:absolute;right:16px;top:16px;width:330px;max-height:calc(100% - 32px);overflow:auto;padding:14px 16px 14px;display:flex;flex-direction:column;gap:12px}
h1{font:800 22px/1.05 var(--font-display);font-stretch:80%;letter-spacing:.01em;margin:0;text-wrap:balance;text-transform:uppercase}
.sub{color:var(--muted);font-size:12px;margin:4px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 9px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.tab b{font:700 13px/1.15 var(--font-display);font-stretch:88%;text-transform:uppercase;letter-spacing:.02em}
.tab span{font:400 10.5px/1.2 var(--font-mono);color:var(--muted)}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-selected="true"] span{color:#c9d3d1}
.tab:focus-visible,.chip:focus-visible,.view:focus-visible{outline:2px solid var(--hub);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:500 11.5px/1.3 var(--font-body);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:#eef2f1}
.chip[aria-pressed="true"]::before{content:"● ";color:var(--hub)}
.view{appearance:none;border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 9px;font:500 11.5px var(--font-body);cursor:pointer;color:var(--ink)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(27,40,45,.25)}
.eyebrow{font:500 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#right h2{font:800 19px/1.1 var(--font-display);font-stretch:84%;text-transform:uppercase;margin:4px 0 0;text-wrap:balance}
#right p{margin:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;border-top:1px solid var(--line);padding-top:10px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;font:500 12.5px/1.4 var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv dd.good{color:var(--hub)} .kv dd.bad{color:var(--ruko)}
.notes{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.note{font-size:12.5px;padding-left:10px;border-left:3px solid var(--line)}
.note.warn{border-left-color:var(--amber)}
.note.find{border-left-color:var(--ruko)}
.disc{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
#hint{position:absolute;left:16px;bottom:12px;font:400 11px var(--font-mono);color:var(--muted);background:rgba(233,237,235,.8);padding:3px 6px;border-radius:3px}
#north{position:absolute;right:362px;bottom:14px;width:44px;height:44px;pointer-events:none}
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #stage{flex:0 0 auto;height:58vh;min-height:320px}
  #left,#right{position:static;width:auto;max-width:none;max-height:none;margin:12px 16px 0}
  #right{margin-bottom:16px}
  #north{right:14px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Model massa 3D Plaza Shinta"></canvas>
    <div id="labels"></div>
    <svg id="north" viewBox="0 0 44 44" aria-hidden="true"><g id="needle"><circle cx="22" cy="22" r="20" fill="rgba(248,250,249,.9)" stroke="#cbd3d1"/><path d="M22 5 L28 26 L22 22 L16 26 Z" fill="#1b282d"/><text x="22" y="39" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#5d6b70">U</text></g></svg>
    <div id="hint">seret: putar · shift+seret / dua jari: geser · gulir: zoom</div>
  </div>

  <section id="left" class="panel" aria-label="Skenario">
    <div>
      <h1>Plaza Shinta<br>Model Massa</h1>

    </div>
    <div class="tabs" role="tablist" aria-label="Pilih skenario">
      <button class="tab" role="tab" data-s="eksisting" id="tab-eksisting"><b>Eksisting</b><span>2026</span></button>
      <button class="tab" role="tab" data-s="tahap-1" id="tab-tahap-1"><b>Tahap 1</b><span>2027–2031</span></button>
      <button class="tab" role="tab" data-s="tahap-2" id="tab-tahap-2"><b>Tahap 2</b><span>2032–2061</span></button>
      <button class="tab" role="tab" data-s="rombak" id="tab-rombak"><b>Rombak</b><span>cadangan, bila uji gagal</span></button>
      <button class="tab" role="tab" data-s="int-before" id="tab-int-before"><b>Interior · sebelum</b><span>denah mal eksisting</span></button>
      <button class="tab" role="tab" data-s="int-after" id="tab-int-after"><b>Interior · sesudah</b><span>tata ruang hub</span></button>
    </div>
    <div class="row" id="floors" aria-label="Pilih lantai" style="display:none">
      <button class="chip fl" data-f="1" aria-pressed="true">Lantai 1</button>
      <button class="chip fl" data-f="2" aria-pressed="false">Lantai 2</button>
      <button class="chip fl" data-f="3" aria-pressed="false">Lantai 3</button>
    </div>
    <div class="row" aria-label="Lapisan">
      <button class="chip" id="t-labels" aria-pressed="true">Label</button>
      <button class="chip" id="t-zones" aria-pressed="false">Zonasi RDTR</button>
      <button class="chip" id="t-boundary" aria-pressed="true">Batas aset</button>
      <button class="chip" id="t-context" aria-pressed="true">Lingkungan</button>
    </div>
    <div class="row">
      <button class="view" id="v-persp">Perspektif</button>
      <button class="view" id="v-top">Tampak atas</button>
      <button class="view" id="v-south">Dari Jl. Teuku Umar</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <aside id="right" class="panel" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

];

/* ---------- Three.js dasar ---------- */
var stage=document.getElementById('stage'), canvas=document.getElementById('c');

 'eksisting':[[0xb8b2a8,'Gedung utama'],[0xc4463a,'Ruko (bukan aset)'],[0x46699c,'SMK PGRI 109'],[0x3fb3c9,'Kolam renang'],[0xd4a400,'Batas aset'],[0xb7c9a3,'Tanah kosong (luar aset)']],
 'tahap-1':[[0x0e7c7b,'Hub logistik'],[0xcfd4d2,'Belum dipakai'],[0xd99a1c,'Dok bongkar muat'],[0xc4463a,'Ruko (bukan aset)'],[0x46699c,'SMK PGRI 109']],
 'tahap-2':[[0x0e7c7b,'Hub lantai dasar'],[0x2f9c96,'Hub lantai 2–3'],[0x7fb069,'Ruang terbuka hijau'],[0xc4463a,'Ruko (bukan aset)'],[0x46699c,'SMK PGRI 109']],
 'rombak':[[0x0e7c7b,'Hub fase 1'],[0xd99a1c,'Hub fase 2 (opsional)'],[0x7d3f3a,'Tapak gedung lama'],[0xc4463a,'Ruko (bukan aset)'],[0x46699c,'SMK PGRI 109']]
};
var LB=[[0xd9c9a8,'Kios tersisa'],[0xc9c2b5,'Ruangan'],[0xb59ac2,'Ruang rapat / ballroom'],[0xece6d6,'Lantai kosong (sudah dibongkar)'],[0xdfe4e1,'Atrium'],[0x4a5356,'Bukaan lantai'],[0x6d7578,'Eskalator'],[0x56636a,'Pintu besi geser'],[0x8a4f5c,'Bioskop'],[0x7fb069,'Lapangan futsal'],[0x9aa0a0,'Ruang ditembok']];
var LA=[[0x9fd3cf,'Sortir & proses'],[0xf0c987,'Penyangga transit'],[0xf7e9a8,'Gang & akses'],[0xc3cde6,'Penunjang'],[0xd7c3e0,'Area fleksibel'],[0x0e7c7b,'Konveyor'],[0xd99a1c,'Roll cage / dok'],[0xb5772a,'Rak']];
['ib1','ib2','ib3'].forEach(function(k){LEG[k]=LB;});['ia1','ia2','ia3'].forEach(function(k){LEG[k]=LA;});
var ZLEG=Object.keys(ZINFO).map(function(k){return [ZINFO[k].c,ZINFO[k].n];});
function hex(c){return '#'+('000000'+c.toString(16)).slice(-6);}
function renderLegend(){var a=LEG[cur].concat(gZones.visible?ZLEG:[]);document.getElementById('legend').innerHTML=a.map(function(r){return '<span><i style="background:'+hex(r[0])+'"></i>'+esc(r[1])+'</span>';}).join('');}

var cur='eksisting', mode='eksisting', floor=1, showLabels=true;
function isInt(){return mode==='int-before'||mode==='int-after';}
function setScenario(k,fromHash){var was=isInt(), m=/^(int-before|int-after)(?:-([123]))?$/.exec(k||'');
  if(m){mode=m[1];if(m[2])floor=+m[2];}else{if(!S[k]||/^i[ab]\d$/.test(k))k='eksisting';mode=k;}
  cur=isInt()?(mode==='int-before'?'ib':'ia')+floor:mode;
  Object.keys(S).forEach(function(n){S[n].visible=(n===cur);});
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.s===mode?'true':'false');});
  document.getElementById('floors').style.display=isInt()?'':'none';
  document.querySelectorAll('.fl').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.f===floor?'true':'false');});
  renderInfo(cur);renderLegend();
  if(isInt()!==was){if(isInt())view(-0.42,0.62,235,-6,-4);else view(-0.5,0.9,470,-15,-5);}
  var h=mode+(isInt()?'-'+floor:'');
  if(!fromHash){try{if(location.hash!=='#'+h)location.hash=h;}catch(e){}}
}
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){setScenario(b.dataset.s);});});
document.querySelectorAll('.fl').forEach(function(b){b.addEventListener('click',function(){setScenario(mode+'-'+b.dataset.f);});});
window.addEventListener('hashchange',function(){setScenario(location.hash.slice(1),true);});
function toggle(id,fn){var b=document.getElementById(id);b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on?'true':'false');fn(on);});}
toggle('t-labels',function(on){showLabels=on;});
toggle('t-zones',function(on){gZones.visible=on;renderLegend();});
toggle('t-boundary',function(on){gBoundary.visible=gBoundary2.visible=on;});
toggle('t-context',function(on){gContext.visible=on;});

/* ---------- Kamera orbit sederhana ---------- */
var tgt=new THREE.Vector3(-15,0,-5), sph={r:470,th:-0.5,ph:0.9}, goal=null;
function applyCam(){sph.ph=Math.max(0.02,Math.min(1.5,sph.ph));sph.r=Math.max(60,Math.min(900,sph.r));
  camera.position.set(tgt.x+sph.r*Math.sin(sph.ph)*Math.sin(sph.th),tgt.y+sph.r*Math.cos(sph.ph),tgt.z+sph.r*Math.sin(sph.ph)*Math.cos(sph.th));camera.lookAt(tgt);
  document.getElementById('needle').setAttribute('transform','rotate('+(sph.th*180/Math.PI)+' 22 22)');}
function view(th,ph,r,tx,tz){goal={th:th,ph:ph,r:r,x:tx,z:tz};}
document.getElementById('v-persp').onclick=function(){isInt()?view(-0.42,0.62,235,-6,-4):view(-0.5,0.9,470,-15,-5);};
document.getElementById('v-top').onclick=function(){isInt()?view(0,0.02,250,-6,-4):view(0,0.02,560,-25,-15);};
document.getElementById('v-south').onclick=function(){view(0.08,1.2,380,-5,-10);};
var ptrs={}, last=null, pinch=0;
stage.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('.panel'))return;stage.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};goal=null;stage.classList.add('drag');});
stage.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptrs);
  if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;if(pinch){sph.r*=pinch/d;pan(mx-last.x,my-last.y);}pinch=d;last={x:mx,y:my};return;}
  var dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};
  if(e.shiftKey||e.buttons===2){pan(dx,dy);}else{sph.th-=dx*0.006;sph.ph-=dy*0.005;}});
function up(e){delete ptrs[e.pointerId];pinch=0;var ids=Object.keys(ptrs);if(ids.length===1)last={x:ptrs[ids[0]].x,y:ptrs[ids[0]].y};if(!ids.length)stage.classList.remove('drag');}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('contextmenu',function(e){e.preventDefault();});
stage.addEventListener('wheel',function(e){e.preventDefault();goal=null;sph.r*=Math.exp(e.deltaY*0.0012);},{passive:false});
function pan(dx,dy){var k=sph.r*0.0016,c=Math.cos(sph.th),s=Math.sin(sph.th);tgt.x+=(-dx*c-dy*s)*k;tgt.z+=(dx*s-dy*c)*k;tgt.x=Math.max(-300,Math.min(300,tgt.x));tgt.z=Math.max(-300,Math.min(300,tgt.z));}

/* ---------- Loop ---------- */
var W=0,H=0,v3=new THREE.Vector3();
function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(w===W&&h===H)return;W=w;H=h;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function frame(){resize();
  if(goal){var t=0.12;sph.th+=(goal.th-sph.th)*t;sph.ph+=(goal.ph-sph.ph)*t;sph.r+=(goal.r-sph.r)*t;tgt.x+=(goal.x-tgt.x)*t;tgt.z+=(goal.z-tgt.z)*t;if(Math.abs(goal.th-sph.th)+Math.abs(goal.ph-sph.ph)<0.002&&Math.abs(goal.r-sph.r)<1)goal=null;}
  applyCam();renderer.render(scene,camera);
  // di layar lebar, panel menutupi sisi kiri-kanan: sembunyikan label di bawah panel
  var wide=W>860;
  LABELS.forEach(function(l){var on=l.z?gZones.visible:(showLabels&&(l.s==='*'||l.s.indexOf(cur)>=0));
    if(on){v3.copy(l.v).project(camera);var x=(v3.x*0.5+0.5)*W,y=(-v3.y*0.5+0.5)*H;on=v3.z<1&&x>40&&x<W-40&&y>24&&y<H-8;if(on&&wide&&((x<340&&y<470)||x>W-370))on=false;
      if(on){l.el.style.left=x+'px';l.el.style.top=(y-(l.z?0:10))+'px';}}
    l.el.style.display=on?'block':'none';});
  requestAnimationFrame(frame);
}
setScenario((location.hash||'').slice(1)||'eksisting',true);
frame();
})();
